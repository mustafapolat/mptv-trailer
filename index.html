<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MPTV Fragman</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  MPTV (LG webOS) için YouTube fragman aracı sayfası.
  TV uygulaması file:// üzerinden çalıştığından YouTube gömülü oynatıcıyı (hata 153) reddediyor;
  bu sayfa iframe içinde açılır ve oynatıcıyı bir https kökeninden yükler.
  Kullanım: index.html?v=VIDEO_ID&mute=1&start=0
  Ebeveyne postMessage ile {mptv:1, ev:'ready'|'state'|'error'|'time', ...} gönderir,
  {mptvCmd:'mute'|'unmute'|'play'|'pause'|'seek'|'time', by} komutlarını alır.
-->
<div id="p"></div>
<script>
  var q = new URLSearchParams(location.search);
  var vid = (q.get('v') || '').replace(/[^\w-]/g, '');
  var player = null;
  function send(m) { m.mptv = 1; try { parent.postMessage(JSON.stringify(m), '*'); } catch (e) {} }
  window.onYouTubeIframeAPIReady = function () {
    if (!vid) { send({ ev: 'error', code: 'novideo' }); return; }
    player = new YT.Player('p', {
      videoId: vid,
      host: 'https://www.youtube-nocookie.com',
      playerVars: {
        autoplay: 1, mute: q.get('mute') === '0' ? 0 : 1, controls: 0, disablekb: 1, fs: 0,
        rel: 0, iv_load_policy: 3, playsinline: 1, cc_load_policy: 0, start: +(q.get('start') || 0),
      },
      events: {
        onReady: function (e) { e.target.playVideo(); send({ ev: 'ready', d: e.target.getDuration() }); poll(); },
        onStateChange: function (e) { report(e.data); },
        onError: function (e) { send({ ev: 'error', code: e.data }); },
      },
    });
  };
  // Bazı ortamlarda (webOS) onStateChange gelmiyor: durumu yoklayıp değişince bildir
  var last = null;
  function report(st) { if (st !== last) { last = st; send({ ev: 'state', s: st }); } }
  function poll() { setInterval(function () { if (player && player.getPlayerState) report(player.getPlayerState()); }, 500); }
  window.addEventListener('message', function (e) {
    var d;
    try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (!d || !d.mptvCmd || !player || !player.getPlayerState) return;
    switch (d.mptvCmd) {
      case 'mute': player.mute(); break;
      case 'unmute': player.unMute(); player.setVolume(100); break;
      case 'play': player.playVideo(); break;
      case 'pause': player.pauseVideo(); break;
      case 'seek': player.seekTo(Math.max(0, player.getCurrentTime() + (+d.by || 0)), true); break;
      case 'time': send({ ev: 'time', t: player.getCurrentTime(), d: player.getDuration(), s: player.getPlayerState() }); break;
    }
  });
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
